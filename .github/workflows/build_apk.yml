name: Build APK

# 触发方式：
#   - 推送 main 分支时自动打包
#   - 也可在 GitHub → Actions → Build APK → “Run workflow” 手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 如需固定版本可改成： flutter-version: '3.29.0'

      - name: Generate Android scaffold
        # 仓库里没有提交 android/ 目录，先在云端生成（不碰 lib/ 和 pubspec）
        run: flutter create --platforms=android .

      - name: Download offline TTS model (必须成功，否则听书功能不可用)
        run: bash tools/download_tts_model.sh

      - name: Verify TTS model files
        run: |
          if [ ! -f assets/tts-model/manifest.txt ]; then
            echo "::error::assets/tts-model/manifest.txt 不存在，模型未正确下载"
            exit 1
          fi
          ONNX_COUNT=$(find assets/tts-model -name "*.onnx" -type f | wc -l)
          if [ "$ONNX_COUNT" -eq 0 ]; then
            echo "::error::未找到 .onnx 模型文件"
            exit 1
          fi
          echo "模型文件已就绪（共 $(wc -l < assets/tts-model/manifest.txt) 个）："
          cat assets/tts-model/manifest.txt
          echo ""
          echo "磁盘占用："
          du -sh assets/tts-model

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Android (权限 + minSdk + 锁屏音频服务 + compileSdk)
        # 必须在 pub get 之后执行：需要 pub-cache 里已有插件模块才能改它们的 compileSdk
        run: python3 tools/patch_android.py

      - name: Build APK (按 CPU 架构拆分，体积更小)
        run: |
          flutter clean
          flutter build apk --split-per-abi --no-tree-shake-icons

      - name: Verify APK contains TTS model assets
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          echo "检查 APK: $APK"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 arm64 APK"
            exit 1
          fi
          echo "APK 内 assets/tts-model 内容："
          unzip -l "$APK" | grep -E "assets/tts-model/" | head -30
          if unzip -l "$APK" | grep -q "assets/tts-model/.*\.onnx"; then
            echo "✅ APK 已包含 .onnx 模型文件"
          else
            echo "::error::APK 未包含 .onnx 模型文件，听书功能将不可用"
            exit 1
          fi
          if unzip -l "$APK" | grep -q "assets/tts-model/manifest.txt"; then
            echo "✅ APK 已包含 manifest.txt"
          else
            echo "::error::APK 未包含 manifest.txt"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: txt-reader-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
