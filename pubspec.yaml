name: txt_reader
description: 纯白极简本地 TXT 阅读器（离线、无广告、AI 离线听书）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 本地存储（无需代码生成，初学者友好）
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 状态管理
  provider: ^6.1.2

  # 多选导入 TXT（系统文件管理器，仅显 txt，支持多选）
  file_picker: ^8.0.0

  # 自动识别 UTF-8 / GBK 等编码并解码
  flutter_charset_detector: ^6.0.0

  # 长按 1 秒拖拽排序（enableLongPress + longPressDelay）
  flutter_reorderable_grid_view: ^5.6.0

  # 仿真翻页（真实书页卷曲动画，Dart3 兼容）
  page_turn_animation: ^0.1.4

  # 后台 / 锁屏播放
  audio_service: ^0.18.1
  just_audio: ^0.9.36

  # AI 离线听书（集成离线神经语音模型，完全不联网）
  sherpa_onnx: ^1.10.0

  # 智能分页（按字符安全切分，不切字）
  characters: ^1.3.0

  # 应用支持目录（用于拷贝 TTS 模型）
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tts-model/
